  </g>

  <!-- Explanation callouts -->
  <g>
    <circle class="dot" cx="292" cy="230" r="4" />
    <line class="line" x1="292" y1="230" x2="215" y2="230" />
    <text class="label-title" x="38" y="222">order_items 테이블</text>
    <text class="label-body" x="38" y="252">주문에 포함된 상품 목록을</text>
