    <line class="row-line" x1="0" y1="148" x2="270" y2="148" />
    <text class="col" x="22" y="170">◆</text><text class="col" x="72" y="170">status</text><text class="type" x="225" y="170">text</text>
    <line class="row-line" x1="0" y1="184" x2="270" y2="184" />
    <text class="col" x="22" y="206">◆</text><text class="col" x="72" y="206">source</text><text class="type" x="225" y="206">text</text>
    <line class="row-line" x1="0" y1="220" x2="270" y2="220" />
    <text class="col" x="22" y="242">◇</text><text class="col" x="72" y="242">recommendation_note</text><text class="type" x="225" y="242">text</text>
    <line class="row-line" x1="0" y1="256" x2="270" y2="256" />
  </g>

