<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#e6e6e6" />
    </pattern>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
    <style>
      .bg { fill: #fbfbfa; }
      .card { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.4; filter: url(#cardShadow); }
      .head { fill: #fafafa; stroke: #d6d6d6; stroke-width: 1.2; }
      .row-line { stroke: #e3e3e3; stroke-width: 1; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .col { font-family: Arial, sans-serif; font-size: 13px; fill: #111111; }
      .type { font-family: Consolas, monospace; font-size: 11px; fill: #777777; }
      .pk { fill: #222222; }
      .fk { fill: #6f7f95; }
      .line { stroke: #4b4b4b; stroke-width: 1.8; fill: none; }
      .rel { stroke: #7b7b7b; stroke-width: 1.5; fill: none; }
      .dot { fill: #111111; }
      .label-title { font-family: Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #111111; }
      .label-body { font-family: Arial, sans-serif; font-size: 16px; fill: #111111; }
      .small-note { font-family: Arial, sans-serif; font-size: 13px; fill: #606060; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1000" />
  <rect width="1600" height="1000" fill="url(#dotGrid)" opacity="0.75" />

  <!-- Relationship lines -->
  <path class="rel" d="M585 165 H655 V385 H585" />
  <path class="rel" d="M585 205 H700 V438 H815" />
  <path class="rel" d="M1040 395 H980 V438 H940" />
  <path class="rel" d="M1040 490 H980 V748 H940" />
  <path class="rel" d="M1040 748 H975 V805 H940" />
  <path class="rel" d="M1295 805 H1225 V748 H1200" />

  <!-- order_items -->
  <g transform="translate(300 155)">
    <rect class="card" width="285" height="305" rx="8" />
    <rect class="head" width="285" height="38" rx="8" />
    <text class="title" x="18" y="25">order_items</text>
    <text class="col" x="22" y="62">◇ ◆ #</text><text class="col" x="82" y="62">id</text><text class="type" x="235" y="62">int8</text>
    <line class="row-line" x1="0" y1="76" x2="285" y2="76" />
    <text class="col" x="22" y="98">◆</text><text class="col" x="82" y="98">order_id</text><text class="type" x="225" y="98">uuid</text>
    <line class="row-line" x1="0" y1="112" x2="285" y2="112" />
    <text class="col" x="22" y="134">◆</text><text class="col" x="82" y="134">vitamin_id</text><text class="type" x="235" y="134">int8</text>
    <line class="row-line" x1="0" y1="148" x2="285" y2="148" />
    <text class="col" x="22" y="170">◆</text><text class="col" x="82" y="170">product_name</text><text class="type" x="235" y="170">text</text>
    <line class="row-line" x1="0" y1="184" x2="285" y2="184" />
    <text class="col" x="22" y="206">◆</text><text class="col" x="82" y="206">category</text><text class="type" x="235" y="206">text</text>
    <line class="row-line" x1="0" y1="220" x2="285" y2="220" />
    <text class="col" x="22" y="242">◆</text><text class="col" x="82" y="242">quantity</text><text class="type" x="235" y="242">int4</text>
    <line class="row-line" x1="0" y1="256" x2="285" y2="256" />
    <text class="col" x="22" y="278">◆</text><text class="col" x="82" y="278">unit_price</text><text class="type" x="235" y="278">int4</text>
    <line class="row-line" x1="0" y1="292" x2="285" y2="292" />
    <text class="col" x="22" y="314">◆</text><text class="col" x="82" y="314">line_total</text><text class="type" x="235" y="314">int4</text>
  </g>

